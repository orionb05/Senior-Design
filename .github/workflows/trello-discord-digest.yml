name: Trello Daily Discord Digest

on:
  schedule:
    # 12:00 UTC = 8:00 AM EDT (Mar-Nov) / 7:00 AM EST (Nov-Mar).
    # GitHub cron is best-effort and can run a few minutes late.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post digest to Discord
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: "6a7df02e0af26b99dffba7b9"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/trello_to_discord.py
